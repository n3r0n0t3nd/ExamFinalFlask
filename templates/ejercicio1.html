{% extends "base.html" %}

{% block contenido %}
  <section class="formulario">
    <h1>Calculo de compras</h1>

    <form method="post">
      <label>Ingresa tu nombre</label>
      <input type="text" name="nombre" value="{{ request.form.nombre }}" required>

      <label>Ingresa tu edad</label>
      <input type="number" name="edad" value="{{ request.form.edad }}" required>

      <label>Ingresa la cantidad de tarros de pintura a comprar</label>
      <input type="number" name="cantidad" value="{{ request.form.cantidad }}" required>

      <button type="submit" class="calcular">Calcular</button>
    </form>

    {% if nombre %}
      <div class="resultado">
        <p>Nombre del cliente: {{ nombre }}</p>
        <p>Total sin descuento: ${{ total|int }}</p>
        <p>El descuento es : ${{ descuento|int }}</p>
        <p>El total a pagar es de : ${{ pagar|int }}</p>
      </div>
    {% endif %}
  </section>
{% endblock %}
